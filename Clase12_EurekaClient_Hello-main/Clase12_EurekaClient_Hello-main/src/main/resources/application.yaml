spring:
  application:
    name: Clase12_EurekaClient_Hello

server:
  port: 8001

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${random.int}
    #eureka.instance.lease-renewal-interval-in-seconds=30

info:
  app:
    name: EurekaClient Clase12 Hello

management:
  endpoints:
    web:
      exposure:
        include: health,beans,loggers,info
  info:
    env:
      enabled: true
  java:
    enabled: true